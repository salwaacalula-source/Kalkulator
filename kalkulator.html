<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator Pink</title>
    <link rel="stylesheet" href="style.css" />
    <script src="kalkulator.js" defer></script>
  </head>
  <body>
    <div class="kalkulator">
      <h1>Kalkulator</h1>
      <div id="riwayat"></div>
      <div id="layar">0</div>

      <div class="tombol">
        <button id="hapusSemua" class="lebar operator">C</button>
        <button id="hapusSatu" class="operator">⌫</button>
        <button class="operator" data-operator="/">÷</button>

        <button class="angka">7</button>
        <button class="angka">8</button>
        <button class="angka">9</button>
        <button class="operator" data-operator="*">×</button>

        <button class="angka">4</button>
        <button class="angka">5</button>
        <button class="angka">6</button>
        <button class="operator" data-operator="-">−</button>

        <button class="angka">1</button>
        <button class="angka">2</button>
        <button class="angka">3</button>
        <button class="operator" data-operator="+">+</button>

        <button class="angka lebar">0</button>
        <button id="desimal">.</button>
        <button id="sama" class="sama">=</button>
      </div>
    </div>
  </body>
</html>
